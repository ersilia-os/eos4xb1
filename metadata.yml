Status: Ready
Title: Antihypertension prediction
Description: Scores molecules for antihypertensive potential, overall and through
  three mechanisms, angiotensin-converting enzyme inhibition, calcium channel blockade
  and angiotensin II receptor antagonism, with separate models for natural products
  and for synthetic derivatives. Ersilia trained the six LazyQSAR classifiers for
  the Centre for Drug Discovery at the University of Buea, whose team curated the
  actives. Negatives are property-matched ChEMBL decoys at about ten per active rather
  than measured inactives, so the scores rank candidates instead of estimating real
  hit rates.
