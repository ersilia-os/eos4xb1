Identifier: eos4xb1
Slug: antihypertension-prediction
Status: Ready
Title: Antihypertension prediction
Description: 'Estimates antihypertensive potential both overall and against three
  specific mechanisms: angiotensin-converting enzyme inhibition, calcium channel blockade
  and angiotensin II receptor antagonism. Separate outputs distinguish natural products
  from synthetic derivatives, reflecting how the underlying collection was assembled.
  Actives were manually curated by the Centre for Drug Discovery at the University
  of Buea, giving coverage of natural product chemistry from African medicinal plants
  that public databases represent poorly.'
